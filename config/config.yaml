# =============================================================================
# Robot Battery Monitor / ButlerBot — main configuration
# =============================================================================
# Loaded by src.config. Section roles:
#   dashboard, monitoring, safety, lru, requirements, robot, power,
#   cooling, database, power_channels, digital_twin, agent, simulation,
#   hardware
# Hardware kinematics/profile details also live under config/hardware_profiles/.
# =============================================================================

# HTTP bind defaults for the local PMS UI (Docker maps host port separately)
dashboard:
  host: "127.0.0.1"          # DASHBOARD_HOST env overrides (Docker sets 0.0.0.0)
  port: 5000
  # Browser origins for the API cookie (RBM_CORS_ORIGINS env overrides, comma list).
  # Empty/missing → http://127.0.0.1:<port> and http://localhost:<port>.
  cors_origins: []

# Logging / archive cadence for historical battery samples
monitoring:
  low_battery_threshold: 20
  archive_after_days: 30
  log_level: "INFO"
  archive_interval_hours: 24      # ← How often to run auto-archive (in background)

# Battery, thermal, and over-budget trip points for the safety monitor
safety:
  low_battery_warning_pct: 20
  low_battery_critical_pct: 10
  spike_threshold_pct: 35
  over_draw_warning_pct: 92
  system_over_budget_pct: 98
  thermal_ambient_c: 22.0
  thermal_warning_c: 55.0
  thermal_critical_c: 68.0
  thermal_max_c: 75.0
  thermal_heating_factor: 0.78
  thermal_cooling_rate: 0.035
  twin_thermal_stress_mult: 1.9
  safety_throttle_factor: 0.85
  critical_throttle_factor: 0.70

# Line-replaceable unit groups for degrade priority (EPS first, arms last, etc.)
lru:
  groups:
    - id: eps
      label: EPS (Power System)
      channels: ["Legs", "Arms", "Torso", "Compute", "Cooling"]
      degrade_priority: 5
      tier: 1
    - id: cooling
      label: Cooling (Dry Ice Loop)
      channels: ["Cooling"]
      degrade_priority: 2
      tier: 2
    - id: locomotion
      label: Locomotion (LRUA)
      channels: ["Legs"]
      degrade_priority: 3
      tier: 2
    - id: arms
      label: Arms
      channels: ["Arms"]
      degrade_priority: 1
      tier: 2
    - id: torso
      label: Torso
      channels: ["Torso"]
      degrade_priority: 2
      tier: 2
    - id: compute
      label: Compute
      channels: ["Compute"]
      degrade_priority: 4
      tier: 2
  thresholds:
    over_draw_warning_pct: 90
    spike_threshold_pct: 30
    # Milder sag model — 0.18 permanently faulted Compute at normal idle load
    voltage_sag_factor: 0.12
    low_voltage_warning_pct: 0.90
    low_voltage_critical_pct: 0.82
    degrade_throttle_caution: 0.92
    degrade_throttle_degraded: 0.80
    degrade_throttle_critical: 0.65

# Soft power budgets by mission task (must not false-trip idle → throttle loops)
requirements:
  startup_cost_wh: 6.0
  eps_reserve_pct: 12
  system_min_draw_w: 18
  system_max_draw_w: 62
  lru_budgets:
    # Soft budgets must sit at/above TASK_PROFILES draw_targets so idle does not
    # permanently trip "exceeds budget" → safety fault → agent throttle loops.
    idle:
      locomotion: {min_draw_w: 2, max_draw_w: 12, budget_w: 8}
      arms: {min_draw_w: 4, max_draw_w: 18, budget_w: 10}
      torso: {min_draw_w: 3, max_draw_w: 14, budget_w: 8}
      compute: {min_draw_w: 6, max_draw_w: 12, budget_w: 12}
      cooling: {min_draw_w: 1, max_draw_w: 10, budget_w: 4}
    moving:
      # Dual Pololu 37D cruise ~16–22 W Legs; allow brief stress without agent thrash
      locomotion: {min_draw_w: 8, max_draw_w: 36, budget_w: 24}
      arms: {min_draw_w: 5, max_draw_w: 18, budget_w: 10}
      torso: {min_draw_w: 7, max_draw_w: 14, budget_w: 11}
      compute: {min_draw_w: 6, max_draw_w: 12, budget_w: 9}
      cooling: {min_draw_w: 2, max_draw_w: 10, budget_w: 5}
    balanced:
      locomotion: {min_draw_w: 6, max_draw_w: 36, budget_w: 18}
      arms: {min_draw_w: 6, max_draw_w: 18, budget_w: 10}
      torso: {min_draw_w: 5, max_draw_w: 14, budget_w: 8}
      compute: {min_draw_w: 6, max_draw_w: 12, budget_w: 9}
      cooling: {min_draw_w: 2, max_draw_w: 10, budget_w: 4}
    high_load:
      locomotion: {min_draw_w: 14, max_draw_w: 40, budget_w: 28}
      arms: {min_draw_w: 12, max_draw_w: 18, budget_w: 17}
      torso: {min_draw_w: 8, max_draw_w: 14, budget_w: 12}
      compute: {min_draw_w: 7, max_draw_w: 12, budget_w: 10}
      cooling: {min_draw_w: 4, max_draw_w: 10, budget_w: 8}

# Robot identity + pack size (profile file supplies wheeled/biped kinematics)
robot:
  name: "ButlerBot"
  main_battery_capacity_wh: 480   # 48V ~10Ah — compact mobile robot pack
  hardware_profile: butlerbot_wheeled
  # Kilograms of payload on a run. 0 until a mission sets one.
  payload_kg: 0
  # Optional stop for a world that loops (the warehouse has no finish).
  # Leave blank to run until the track finish — the S track is unchanged.
  # Set a number of metres, or set the env var RBM_MISSION_MAX_M (that
  # wins). RBM_MISSION_LAPS=2 stops after two warehouse perimeters
  # (~201 m each) when this is blank. 0 means off.
  mission_max_m:
  # Shoulder HUD paint (hud_nadir / hud_nadir_r). false: do not paint.
  # Lane keeping still reads the nadir cameras. RBM_HUD=1 turns paint on.
  # A black overlay with a magenta border is a stereo camera Webots shows
  # even though it is not enabled. Close it under Robot → Camera Devices.
  hud_overlays: false
  # SPEED_TRACE CSV every 0.1 s of sim time, only while the wheels
  # are moving, and it stops at mission end. Blank: on only when the
  # mission cap is one warehouse lap. RBM_SPEED_TRACE=1 forces it on,
  # 0 forces it off. The S track stays quiet. The file is
  # logs/speed_trace_<timestamp>.csv (or RBM_LOG_DIR). Webots stdout
  # redirected to a file stays empty, so the controller writes this itself.
  speed_trace:
  # Also print those rows on the Webots console. Off: the CSV is the log.
  # RBM_SPEED_TRACE_CONSOLE=1 turns printing on.
  speed_trace_console: false

hardware_profile: butlerbot_wheeled

# Real-hardware build from config/bom/bom.json.
# Leave this blank to keep butlerbot_wheeled.yaml (current behaviour).
# Set one of: light, heavy, budget.
#   light  — 24 V Pololu #4693, 240 Wh LiFePO4
#   heavy  — 12 V planetary motors, 200 mm wheels, 480 Wh
#   budget — 12 V Pololu #4753, Pi 5, 240 Wh
bom_build:

# Rowfit speeds the overnight optimizer is allowed to change.
# Missing or blank keys use the constants in src/rowfit_control.py
# (0.44 m/s cruise, 0.50 m/s straight, 0.9 rad/s pivot, k_steer 2.0).
# The energy model does not read this section. See optimizer/KNOWLEDGE.md.
controller:
  cruise_m_s: 0.44
  straight_m_s: 0.50
  pivot_w_max_rad_s: 0.6
  k_steer: 2.0
  coast_enabled: true             # cut drive before pivot when physics allows (false = legacy brake-only)
  coast_margin_m: 0.0             # extra m added to coast start distance
  # Physics speed cap: effective cruise = min(cruise_m_s, v_max). See docs/PHYSICS_SPEED_LIMIT.md.
  speed_limit:
    # stop_available_m: optional override (m). Default: min(nadir ld_max ~1.60, obstacle range 4.0 when obstacles_in_d_available).
    obstacles_in_d_available: true  # include stereo/radar corridor range in the cruise stop budget
    reaction_latency_s: 0.32        # s — one lane camera frame (matches obstacle gate default)
    safety_margin: 0.8              # unitless — applied to computed v_max
    brake_mu: 0.8                   # ASSUMPTION: dry rubber on sealed concrete (longitudinal μ). Not Webots ODE coulombFriction=8. Validate on hardware.
    # Continuous motor torque as τ_brake is also an ASSUMPTION (see docs/PHYSICS_SPEED_LIMIT.md).
    driven_weight_fraction: 1.0     # bom.json assumptions.turning_scrub: both drive wheels carry weight
    approach_target_m_s: 0.04       # m/s — pivot entry speed (rowfit V_CREEP_M_S)
    # brake_torque_nm_per_motor: optional override; default BoM rec_continuous_torque_nm (10 kg·cm)

# System-level allocatable power ceiling (includes cooling channel)
power:
  system_budget_w: 62   # Total allocatable watts (includes active cooling)

cooling:
  max_draw_w: 10

# Postgres connection for host-local runs (Docker overrides via env / DATABASE_URL)
database:
  host: "localhost"
  port: 5432
  name: "robot_battery"
  user: "robot"
  # password: read from PGPASSWORD / POSTGRES_PASSWORD (or DATABASE_URL).
  # Dev value lives in .env.example; do not commit real passwords here.

# Named power channels shown on the dashboard and allocated by the PMS
power_channels:
  - id: "Legs"
    name: "Drive Motors (2× Pololu 37D)"
    # Was 28 (biped-servo class). Dual 12V gearmotors + driver cruise ~20 W avg;
    # 40 W matches hardware profile and stops false agent intervene on peak.
    max_draw_w: 40
    nominal_voltage: 12
  - id: "Arms"
    name: "Arm + Gripper Systems"
    max_draw_w: 18
    nominal_voltage: 48
  - id: "Torso"
    name: "Torso & Balance Systems"
    max_draw_w: 14
    nominal_voltage: 48
  - id: "Compute"
    name: "Main Computer & Sensors"
    max_draw_w: 12
    nominal_voltage: 24
  - id: "Cooling"
    name: "Dry-Ice / Active Cooling Loop"
    max_draw_w: 10
    nominal_voltage: 24

# Digital twin bridge: Webots (or other) telemetry + dashboard teleop commands
# prefer_external: use live Webots power when feed is fresh (stale_after_s)
digital_twin:
  enabled: true
  adapter: generic
  webots:
    dashboard_url: "http://127.0.0.1:5000"
  accept_external_commands: true
  accept_external_telemetry: true
  prefer_external: true
  stale_after_s: 12
  apply_battery_override: true
  sync_interval_s: 3

# Onboard agent: throttle / task suggestions under stress or low battery
agent:
  enabled: true
  auto_apply_throttle: true
  auto_apply_task_suggestions: true
  twin_auto_apply: true
  history_limit: 32
  low_battery_suggest_pct: 22
  critical_battery_pct: 12
  high_utilization_pct: 88
  # Free-roll ~36 W / 62 budget ≈ 58%; raise so intentional cruise is not "stress"
  twin_stress_utilization_pct: 78
  task_override_hold_s: 14
  loop_margin_warn_pct: 18
  loop_margin_critical_pct: 8
  # Do not treat noisy short-horizon HIGH as an intervention above this SOC
  # when loop forecast is comfortable (or not yet computed).
  prediction_risk_min_battery_pct: 25

# Internal scripted mission driver (dashboard Sim panel) — not Webots itself
simulation:
  enabled: true
  auto_start: true
  loop: true
  driver: butlerbot
  robot_name: ButlerBot
  battery_capacity_wh: 480
  script:
    - task: idle
      duration_s: 20
      label: "Idle / Standby"
    - task: moving
      duration_s: 28
      label: "Wheeled Transit"
    - task: balanced
      duration_s: 22
      label: "Balanced / Patrol"
    - task: high_load
      duration_s: 18
      label: "High Load / Manipulation"
    - task: idle
      duration_s: 14
      label: "Return to Idle"
  draw_profiles:
    idle:       {Legs: 3.5, Arms: 5.0, Torso: 3.5, Compute: 7.5, Cooling: 1.5}
    moving:     {Legs: 20.0, Arms: 8.0, Torso: 10.5, Compute: 9.0, Cooling: 4.0}
    balanced:   {Legs: 12.0, Arms: 9.0, Torso: 7.5, Compute: 8.5, Cooling: 3.5}
    high_load:  {Legs: 24.0, Arms: 16.0, Torso: 12.0, Compute: 10.0, Cooling: 7.5}

# Hardware backend: ROS2 topics (mock allowed in Docker via ROS2_MOCK env)
hardware:
  mode: "real"
  type: "ros2"
  ros2:
    node_name: "robot_battery_monitor"
    mock: false          # true = mock pub/sub even if rclpy is installed
    topics:
      main_battery: "/robot/battery/main_level"
      power_draw: "/robot/battery/power_draw"
      power_status: "/robot/battery/status"
      mission_command: "/robot/battery/command/mission"
      throttle_command: "/robot/battery/command/throttle"
      sensor_power: "/robot/sensors/power_draw"