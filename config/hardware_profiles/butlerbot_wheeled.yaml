# =============================================================================
# ButlerBot wheeled — first grounded hardware profile (v1)
# =============================================================================
# Public-spec style numbers for a compact warehouse butler (~0.9–1.0 m tall).
# Used by src/twin/webots_power.py for channel watts and battery metadata.
# Not a vendor BOM — realistic class averages so drain/watts are interpretable.
# =============================================================================

profile_id: butlerbot_wheeled
label: "ButlerBot Wheeled (reference hardware)"
version: "1.0"
description: >
  Compact wheeled mobile manipulator: dual 48V BLDC hub drives, light
  stabilizer/caster budget, Jetson-class compute + baseload sensors,
  48V Li-ion pack. Tuned so Webots idle stays calm (~5W Legs) and
  short drive shows a clear Legs rise without re-entering throttle spirals.

# --- Battery pack -------------------------------------------------------------
battery:
  chemistry: Li-ion
  form_factor: "48V modular pack (10S-class)"
  nominal_voltage_v: 48
  capacity_ah: 10
  capacity_wh: 480          # primary: used for % drain interpretation
  usable_fraction: 0.90     # soft limit for planning (not hard-coded yet)

# --- Drive motors (two wheels) ------------------------------------------------
# Class: 48V hub / hoverboard-style BLDC, ~100–150W continuous each.
# Electrical model (velocity-only when torque feedback missing):
#   P ≈ idle_w + k · ω²   with k chosen so cruise_speed ≈ cruise_w.
motors:
  left_wheel:
    label: "Left BLDC hub (48V, ~120W cont class)"
    part_class: "48V hub motor 6–7in"
    channel: Legs
    voltage_v: 48
    rated_power_w: 120
    peak_power_w: 250
    rated_speed_rpm: 150
    efficiency: 0.75
    idle_w: 2.0               # controller + no-load losses at rest
    cruise_w: 9.5             # target electrical at cruise_speed_m_s (mid-band)
    cruise_speed_m_s: 0.40
    cont_w: 35                # sustained electrical budget for clamps
    peak_w: 40                # per-motor estimate clamp (channel also caps)
    torque_proxy_coeff: 0.38  # τ ≈ coeff · |ω| when feedback is 0
  right_wheel:
    label: "Right BLDC hub (48V, ~120W cont class)"
    part_class: "48V hub motor 6–7in"
    channel: Legs
    voltage_v: 48
    rated_power_w: 120
    peak_power_w: 250
    rated_speed_rpm: 150
    efficiency: 0.75
    idle_w: 2.0
    cruise_w: 9.5
    cruise_speed_m_s: 0.40
    cont_w: 35
    peak_w: 40
    torque_proxy_coeff: 0.38

  # Upper body (kept for Webots joints; light loads at rest)
  torso_joint:
    label: "Torso / balance servo (~50W class)"
    part_class: "RS485 bus servo 48V"
    channel: Torso
    voltage_v: 48
    rated_power_w: 50
    peak_power_w: 90
    efficiency: 0.65
    idle_w: 1.5
    cruise_w: 4.0
    cont_w: 18
    peak_w: 30
    scale: 4.0
  left_arm:
    label: "Left arm servo (~50W class)"
    part_class: "RS485 bus servo 48V"
    channel: Arms
    voltage_v: 48
    rated_power_w: 50
    peak_power_w: 90
    efficiency: 0.65
    idle_w: 1.4
    cont_w: 16
    peak_w: 28
    scale: 4.0
  right_arm:
    label: "Right arm servo (~50W class)"
    part_class: "RS485 bus servo 48V"
    channel: Arms
    voltage_v: 48
    rated_power_w: 50
    peak_power_w: 90
    efficiency: 0.65
    idle_w: 1.4
    cont_w: 16
    peak_w: 28
    scale: 4.0

# --- Stabilizers (casters / balance assist) -----------------------------------
# Small continuous or motion-linked load — not full humanoid legs.
stabilizers:
  label: "Corner casters / balance assist"
  channel: Torso
  idle_w: 0.8                 # bearing / small hold
  active_w: 2.5               # when moving (rolling resistance proxy)
  active_speed_m_s: 0.15      # speed at which active_w is fully applied

# --- Compute + sensors (always-on baseload) -----------------------------------
compute:
  model: "Jetson Orin Nano–class SBC"
  voltage_v: 24
  idle_w: 6.5                 # board at light load
  active_w: 10.0              # teleop / motion (CPU up)
  peak_w: 20.0

sensors:
  label: "IMU + cameras + encoders baseload"
  idle_w: 1.5                 # always-on with compute
  active_w: 2.0               # slightly higher when moving

# Optional mode adders (simple flags for later; vision applied when moving)
modes:
  vision_active_w: 2.5        # light VIO / camera pipeline when driving
  agent_active_w: 0.5         # onboard agent loop overhead (tiny)

# Chassis geometry used by velocity→ω conversion
geometry:
  wheel_radius_m: 0.08
  track_width_m: 0.32

# --- PMS channel caps (dashboard / safety envelopes) --------------------------
channels:
  Legs:
    description: "Differential drive (2× hub motors)"
    max_draw_w: 28
    nominal_voltage_v: 48
    motors: [left_wheel, right_wheel]
  Arms:
    description: "Dual arm joints + gripper budget"
    max_draw_w: 18
    nominal_voltage_v: 48
    motors: [left_arm, right_arm]
  Torso:
    description: "Torso hold + stabilizer budget"
    max_draw_w: 14
    nominal_voltage_v: 48
    motors: [torso_joint]
  Compute:
    description: "SBC + sensors (+ optional vision)"
    max_draw_w: 12
    nominal_voltage_v: 24
    motors: []
  Cooling:
    description: "Dry-ice / fan loop (sim thermal)"
    max_draw_w: 10
    nominal_voltage_v: 24
    motors: []

# Expected mean system draw by mission phase (loop forecast / docs)
phase_draw_w:
  standby: 18.0
  teleop: 45.0
  drive_transit: 48.0
  patrol: 40.0
  manipulate: 55.0
  return_idle: 20.0

phase_duration_s:
  standby: 6
  drive_transit: 14
  patrol: 12
  manipulate: 10
  return_idle: 10
