[pytest]
# Nice colored output + shorter tracebacks
# --dist loadgroup is a no-op without -n (no workers). With -n it is what
# makes xdist_group stick, so the database tests stay on one worker.
# Needs pytest-xdist. A later --dist on the command line overrides this.
addopts = 
    -v
    --tb=short
    --color=yes
    -ra
    --dist loadgroup

# Ignore some noisy warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Where to look for tests
testpaths = tests

markers =
    db: needs the Postgres test database (skipped locally when Postgres is not running; required in CI)
    slow: closed-loop laps and other multi-second tests. The quick set is pytest -m "not slow" -n auto. The full set, before a pull request, is pytest -n auto.
    xdist_group: pin tests that share one resource to a single worker
